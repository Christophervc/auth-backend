spring.application.name=auth
spring.profiles.active=dev

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=username
spring.datasource.password=secret_password

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.highlight_sql=true
spring.jpa.open-in-view=false

# Virtual threads
spring.threads.virtual.enabled=true

# JWT secret
jwt.secret=clave_de_desarrollo_reemplazar_en_produccion_32chars_min
jwt.time.expiration=900000
jwt.time.refresh-expiration=604800000

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Problem detail
spring.mvc.problemdetails.enabled=true

# File size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Cookie cambiar luego secure=true same-site=Strict
app.cookie.secure=false
app.cookie.same-site=Lax

# Logging
logging.level.com.vc.auth_backend=INFO
logging.level.org.springframework.security=WARN

# OTP code TTL
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES}

# SENDER
app.email.from=${EMAIL_FROM}

# RESEND
resend.api-key=${RESEND_API_KEY}