# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis embebido
spring.data.redis.host=localhost
spring.data.redis.port=6380

# JWT test
jwt.secret=EstaClaveTieneQueSerMuyLargaParaHS256ConMas32Caracteres
jwt.time.expiration=3600000
jwt.time.refresh-expiration=86400000

# OTP con TTL de 1 min
app.otp.expiration-minutes=1

# Cookies test
app.cookie.secure=false
app.cookie.same-site=Lax

# Cloudinary test
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test

# Email test
#el EmailProvider debe ser mockeado con @MockBean
#app.email.from=test@example.com
#resend.api-key=re_test_key

# OAuth2.0 test local
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
app.oauth2.redirect-uri.success=http://localhost:8080/api/v1/users/me
app.oauth2.redirect-uri.failure=http://localhost:8080/oauth2/error

# Logging test
logging.level.com.vc.auth_backend=WARN
logging.level.org.springframework.security=WARN
logging.level.io.lettuce=WARN


